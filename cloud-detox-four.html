<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brands Academy Certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.page-wrap{
    height: auto;
    width: 100%;
    background: #1A1A1A;
    padding: 2rem;
}

.certificate{
    width:794px;
    height:1123px; /* A4 */
    position:relative;
    background:#fff;
    overflow:hidden;
    margin:auto;
    background: url(bg1.png);
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
}

.content{
    position:relative;
    z-index:5;
    height:100%;
    padding:40px 60px;
    text-align:center;
}

.logo{
    text-align:left;
}

.logo img{
    height:60px;
}

h1{
    margin-top:80px;
    font-size:72px;
    font-weight:300;
    color:#4d554a;
    letter-spacing:4px;
}

h2{
    font-size:34px;
    font-weight:300;
    color:#4d554a;
    letter-spacing:4px;
}

.given-to{
    margin-top:50px;
    font-size:26px;
    letter-spacing:3px;
    color:#4d554a;
}

.student-name{
    margin-top:80px;
    font-size:56px;
    font-weight:400;
    color:#4d554a;
}

.line{
    width:520px;
    height:3px;
    background:#d7b13d;
    margin:25px auto;
}

.description{
    width:80%;
    margin:0 auto;
    font-size:22px;
    line-height:1.8;
    color:#555;
}

.date{
    margin-top:40px;
    font-size:24px;
    color:#555;
}

.signatures{
    position:absolute;
    left:0;
    right:0;
    bottom:80px;
    display:flex;
    justify-content:space-around;
    padding: 60px;
}

.sign-box{
    text-align:center;
}

.signature-line{
    width:220px;
    height:2px;
    background:#d7b13d;
    margin-bottom:15px;
}

.sign-box h4{
    font-size:24px;
    font-weight:500;
}

.sign-box p{
    font-size:20px;
    color:#666;
}

</style>
</head>
<body>
<div class="page-wrap">
    <div class="certificate">
    <!-- Content -->
    <div class="content">

        <div class="logo">
            <img src="" alt="">
        </div>

        <h1>CERTIFICATE</h1>
        <h2>OF PARTICIPATION</h2>

        <p class="given-to">GIVEN TO</p>

        <h3 class="student-name">
            UNCODEMY
        </h3>

        <div class="line"></div>

        <p class="description">
            is thanked for their participation on
            "JOB FAIR 2022" organized by
            the Brands Academy
        </p>

        <p class="date">
            Held on "16 September 2022"
        </p>

        <div class="signatures">

            <div class="sign-box">
                <img src="" alt="" srcset="">
                <div class="signature-line"></div>
                <h4>R. Monga</h4>
                <p>Vice President</p>
            </div>

            <div class="sign-box">
                <img src="" alt="" srcset="">
                <div class="signature-line">
                </div>
                <h4>SK. Sahu</h4>
                <p>Vice President</p>
            </div>

        </div>

    </div>

</div>
</div>

</body>
</html>
